name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3.2.1 # Nâng cấp lên bản mới nhất để sửa lỗi

    - name: Install Cordova
      run: npm install -g cordova

    - name: Create Cordova Project & Build
      run: |
        cordova create build com.pvz.vn CayVsZombie
        if [ -f config.xml ]; then cp config.xml build/config.xml; fi
        rm -rf build/www/*
        cp -r . build/www/ || true
        # Xóa các thư mục ẩn rác để tránh lỗi copy vòng lặp
        rm -rf build/www/.github
        rm -rf build/www/build
        cd build
        cordova platform add android
        cordova build android

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CayVsZombie-APK
        path: build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
